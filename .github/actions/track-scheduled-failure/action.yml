name: 'Track scheduled full-verification failure'
description: 'Record a scheduled full-verification run that did not pass in one tracking Issue: comment on the open one, or create it when none is open. Needs issues: write. Call after actions/checkout.'
inputs:
  github_token:
    description: 'Token with issues: write'
    required: true
  results:
    description: 'toJSON(needs) of the calling job'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Create or update the tracking Issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RESULTS: ${{ inputs.results }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WORKFLOW: ${{ github.workflow }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # The title is the identity of the tracking Issue; both scheduled workflows share it.
        title='[CI] Scheduled full verification is failing on main'
        job_results=$(jq -r 'to_entries | map("- `\(.key)`: \(.value.result)") | join("\n")' <<< "$RESULTS")
        entry=$(printf '**%s** did not pass in its scheduled run on main.\n\n- Run: %s\n- Commit: %s\n\nJob results:\n\n%s\n' \
          "$WORKFLOW" "$RUN_URL" "$HEAD_SHA" "$job_results")
        # List Issues through the REST API, which is consistent right after a write; search is not.
        number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" |
          jq -rs --arg title "$title" \
            '(add // []) | map(select(.pull_request == null and .title == $title)) | sort_by(.number) | .[0].number // empty')
        if [ -n "$number" ]; then
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$entry"
          echo "Added this failure to tracking Issue #$number." >> "$GITHUB_STEP_SUMMARY"
        else
          intro='Scheduled full verification (installer builds, build tests, io_uring probe and installed-app outbound audit) did not pass on main. Pull requests that leave install, runtime and outbound paths alone skip these jobs, so this daily run is where a regression from such a change shows up.'
          # shellcheck disable=SC2016 # the backticks are literal Markdown
          upkeep='Every scheduled run of `PR Checks` or `Studio outbound gate` that does not pass adds a comment here instead of opening another Issue. Close this Issue once main is green again.'
          body=$(printf '%s\n\n%s\n\n---\n\n%s\n' "$intro" "$upkeep" "$entry")
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body")
          echo "Opened tracking Issue $url." >> "$GITHUB_STEP_SUMMARY"
        fi
