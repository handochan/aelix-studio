name: 'PR Checks'

on:
  workflow_dispatch:
    inputs:
      image_acceptance:
        description: 'Run only the packaged Windows and Linux image acceptance matrix'
        type: boolean
        default: false
      pr_number:
        description: 'PR number to run checks on'
        required: false
        type: string
      commit_sha:
        description: 'Exact merged main commit to verify (mutually exclusive with pr_number)'
        required: false
        type: string
      skip_build_test:
        description: 'Skip the build test job (saves ~45 min)'
        type: boolean
        required: false
        default: false
  pull_request:
    # `labeled` lets the `full-verify` label start full verification (see full-verify-gate). The
    # label cannot reach a pull request that only changes the paths ignored below: this workflow
    # does not start for it. Use workflow_dispatch with pr_number there.
    types: [opened, synchronize, edited, closed, ready_for_review, labeled]
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Daily full verification of main; 18:17 UTC is 03:17 KST.
    - cron: '17 18 * * *'

concurrency:
  group: pr-checks-${{ (inputs.image_acceptance || github.event.label.name == 'run-image-acceptance') && 'image-' || '' }}${{ github.event.pull_request.number || inputs.pr_number || inputs.commit_sha || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: write
  id-token: write

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  # Explicit build-time source; runtime smokes use their isolated environment.
  AELIX_STUDIO_HOST_NODE_MIRROR: 'https://nodejs.org/dist/'

jobs:
  image-acceptance:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.image_acceptance) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-image-acceptance')
    permissions:
      contents: read
    name: Running-input images (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: win32-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    defaults:
      run:
        shell: bash
    env:
      AELIX_STUDIO_HOST_NODE_MIRROR: https://nodejs.org/dist/
      NODE_OPTIONS: --max-old-space-size=8192
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Reject incompatible image acceptance inputs
        id: dispatch-inputs
        if: github.event_name == 'workflow_dispatch' && (inputs.pr_number != '' || inputs.commit_sha != '')
        run: |
          echo 'Use --ref with image_acceptance=true. Omit pr_number and commit_sha.'
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record checked-out commit
        id: checked-out
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        id: dependencies
        run: bun install --frozen-lockfile >/dev/null 2>&1
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: bunx playwright install-deps chromium >/dev/null 2>&1
      - name: Prepare the pinned Provider Preview runtime
        id: prepare
        env:
          PREVIEW_TARGET: ${{ matrix.target }}
        run: python -B scripts/studio-preview/prepare.py --target "$PREVIEW_TARGET" >/dev/null 2>&1
      - name: Build the Provider Preview package without publication
        id: package
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: node scripts/studio-preview/packaging/build.mjs --runtime .local/studio-preview >/dev/null 2>&1
      - name: Run Electron and logged-in WebUI with synthetic images
        id: scenarios
        env:
          IMAGE_PYTHON: python
        run: |
          python -m pip install Pillow==11.3.0 psutil==7.0.0 >/dev/null 2>&1
          python -B tests/fixtures/running-input-images/generate.py --running-input .local/image-acceptance-inputs >/dev/null 2>&1
          if [[ "$RUNNER_OS" == Linux ]]; then
            set -- .local/provider-installer/artifacts/*.deb
            test "$#" -eq 1
            test -f "$1"
            package=$(dpkg-deb --field "$1" Package)
            sudo -n apt-get install -y "$PWD/$1" >/dev/null 2>&1
            manifest=$(dpkg -L "$package" | awk '/\/resources\/studio-preview\/manifest.json$/')
            export IMAGE_EXECUTABLE="${manifest%/resources/studio-preview/manifest.json}/aelix-studio"
            test -x "$IMAGE_EXECUTABLE"
          fi

          run_probe() {
            export IMAGE_SURFACE="$1"
            if [[ "$RUNNER_OS" == Linux ]]; then
              xvfb-run -a node --import tsx tests/fixtures/running-input-images/packaged/run.mjs >/dev/null 2>&1
            else
              node --import tsx tests/fixtures/running-input-images/packaged/run.mjs >/dev/null 2>&1
            fi
          }

          status=0
          run_probe electron || status=1
          if IMAGE_CHROMIUM=$(node tests/fixtures/running-input-images/packaged/installBrowser.mjs 2>/dev/null); then
            export IMAGE_CHROMIUM
            run_probe webui || status=1
          else
            echo 'browser_install=failed' >> "$GITHUB_OUTPUT"
            status=1
          fi
          exit "$status"
      - name: Summarize acceptance
        if: always()
        env:
          PREVIEW_TARGET: ${{ matrix.target }}
          ACCEPTANCE_SHA: ${{ steps.checked-out.outputs.commit }}
          DISPATCH_INPUTS: ${{ steps.dispatch-inputs.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          SCENARIOS: ${{ steps.scenarios.outcome }}
          WEBUI_BROWSER_INSTALL: ${{ steps.scenarios.outputs.browser_install }}
        run: node tests/fixtures/running-input-images/packaged/summary.mjs
      - name: Upload fixed-field acceptance results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-acceptance-${{ matrix.target }}
          path: |
            .local/image-acceptance.json
            .local/image-acceptance-webui.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Full verification (io-uring-trace-probe, provider-preview, build-test) runs for every pull
  # request except one whose changed files are all in the skip set (renderer UI, unit tests, docs)
  # and that has no `full-verify` label. It also runs on a manual run and on the daily scheduled
  # run. The decision and the skip set live in the gate action.
  full-verify-gate:
    name: Full verification decision
    if: >-
      !inputs.image_acceptance && github.event.label.name != 'run-image-acceptance' &&
      (github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: .github/actions
      - id: gate
        uses: ./.github/actions/full-verify-gate
        with:
          jobs: io_uring tracepoint capability, Provider Preview installer, Build Test

  io-uring-trace-probe:
    name: io_uring tracepoint capability (${{ matrix.os }})
    needs: full-verify-gate
    if: needs.full-verify-gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # Slow x64 runners have spent over 18 minutes preparing tools in jobs that share this tracer.
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 25 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run tests exactly the event commit, the one the tracking Issue names;
          # `github.ref` would follow main if it moved while the run was queued.
          ref: ${{ inputs.commit_sha || (github.event_name == 'schedule' && github.sha) || github.ref }}
      - name: Install tracepoint probe tools
        run: sudo apt-get update && sudo apt-get install -y bpftrace strace gcc make liburing-dev xz-utils
      - name: Prepare the shared pinned syscall tracer
        run: |
          if [ "$(uname -m)" = x86_64 ]; then sudo apt-get install -y gcc-multilib; fi
          bash scripts/outbound-audit/bundles/prepareStrace.sh
          echo "$PWD/.local/strace-toolchain/bin" >> "$GITHUB_PATH"
      - name: Record an actual io_uring CONNECT with sudo
        run: sudo -n env "PATH=$PWD/.local/strace-toolchain/bin:$PATH" python3 -I -B scripts/studio-preview/fixtures/uringTrace.py --probe .local/io-uring-trace-probe.json
      - name: Verify SQPOLL context ownership with sudo
        run: sudo -n env "PATH=$PWD/.local/strace-toolchain/bin:$PATH" python3 -I -B scripts/studio-preview/fixtures/uringTrace.py --probe .local/io-uring-trace-probe-sqpoll.json --sqpoll
      - name: Preserve tracepoint capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-uring-trace-probe-${{ matrix.os }}
          path: |
            .local/io-uring-trace-probe*.json
            .local/strace-toolchain/receipt.json
          include-hidden-files: true

  provider-preview:
    name: Provider Preview installer (${{ matrix.target }})
    if: needs.full-verify-gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    needs: [full-verify-gate, io-uring-trace-probe]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: windows-2022, target: win32-x64 }
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || (github.event_name == 'schedule' && github.sha) || github.ref }}
          fetch-depth: 0
      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          commit_sha: ${{ inputs.commit_sha }}
          github_token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          bunx playwright install-deps chromium
          sudo apt-get install -y strace gcc make liburing-dev pkg-config iproute2 bpftrace xz-utils
      - name: Prepare the shared pinned syscall tracer
        if: runner.os == 'Linux'
        run: |
          if [ "$(uname -m)" = x86_64 ]; then sudo apt-get install -y gcc-multilib; fi
          bash scripts/outbound-audit/bundles/prepareStrace.sh
          echo "$PWD/.local/strace-toolchain/bin" >> "$GITHUB_PATH"
      - name: Check preparation boundaries
        run: python -B -m unittest discover -s tests/studio-preview
      - name: Prepare exact native and ACP source wheels with the released host
        run: python -B scripts/studio-preview/prepare.py --target ${{ matrix.target }}
      - name: Check helper regressions before installer assembly
        run: |
          node --import tsx --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          const sandbox = fs.realpathSync.native(fs.mkdtempSync(path.join(os.tmpdir(), 'Studio helper preflight 한글-')));
          Object.assign(process.env, {
            HOME: path.join(sandbox, 'home'), USERPROFILE: path.join(sandbox, 'home'),
            AELIX_STUDIO_RUNTIME: path.resolve('.local/studio-preview'),
            AELIX_AUTH_PATH: path.join(sandbox, 'wrong-root/auth.json'),
            PROVIDER_SANDBOX: sandbox, PROVIDER_OUTPUT: path.resolve('.local/studio-provider'),
          });
          fs.mkdirSync(process.env.HOME, { recursive: true });
          fs.mkdirSync(process.env.PROVIDER_OUTPUT, { recursive: true });
          try {
            await import('./scripts/studio-preview/providerHelperSmoke.mjs');
            const require = createRequire(import.meta.url);
            const builder = createRequire(require.resolve('electron-builder'));
            const library = createRequire(builder.resolve('app-builder-lib'));
            const asar = library('@electron/asar');
            const source = path.join(sandbox, 'archive-source');
            fs.mkdirSync(path.join(source, 'out/main'), { recursive: true });
            fs.writeFileSync(path.join(source, 'out/main/index.js'), 'owned-build-fixture');
            const archive = path.join(sandbox, 'probe.asar');
            await asar.createPackage(source, archive);
            assert.equal(asar.extractFile(archive, path.normalize('out/main/index.js')).toString(), 'owned-build-fixture');
          }
          finally { fs.rmSync(sandbox, { recursive: true, force: true }); }
          JS
      - name: Build the relocatable Provider installer without publication
        env:
          # The Preview builder fixes mac.identity to '-' and uses no signing secrets.
          CSC_FOR_PULL_REQUEST: 'true'
        run: node scripts/studio-preview/packaging/build.mjs --runtime .local/studio-preview
      - name: Install and verify the actual Provider UI with offline mode on
        env:
          STUDIO_PROVIDER_OFFLINE_MODE: '1'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python -B scripts/studio-preview/packaging/acceptance.py --runtime .local/studio-preview
          else
            python -B scripts/studio-preview/packaging/acceptance.py --runtime .local/studio-preview
          fi
      - name: Save installer qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-preview-${{ matrix.target }}
          path: |
            .local/strace-toolchain/receipt.json
            .local/provider-installer/acceptance.json
            .local/provider-installer/aioncore-identity.json
            .local/provider-installer/host-preflight.json
            .local/provider-installer/extensions-qualification.json
            .local/provider-installer/inventory-diff.json
            .local/provider-installer/installer-copy-failure.json
            .local/provider-installer/installer-progress.json
            .local/provider-installer/permission/qualification.json
            .local/provider-installer/permission/renderer-result.json
            .local/provider-installer/permission/outbound*.json
            .local/provider-installer/permission/*.png
            resources/bundled-aioncore/**/build-receipt.json
            resources/bundled-aioncore/**/manifest.json
            resources/bundled-aioncore/**/release-provenance.json
            .local/studio-preview/receipt.json
            .local/studio-preview/qualification.json
            .local/provider-installer/artifacts/*.dmg
            .local/provider-installer/artifacts/*.exe
            .local/provider-installer/artifacts/*.deb
            .local/studio-provider/*.json
            .local/studio-provider/*.png
          if-no-files-found: warn

  # Cancel in-progress runs when PR is closed (merged or manually closed)
  cancel-if-closed:
    name: Cancel if PR closed
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR closed, cancelling in-progress runs via concurrency."

  # Job 1: Code quality checks (TypeScript, Oxlint, Oxfmt)
  code-quality:
    name: Code Quality
    if: >-
      !inputs.image_acceptance && github.event.label.name != 'run-image-acceptance' &&
      github.event_name != 'schedule' &&
      (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          commit_sha: ${{ inputs.commit_sha }}
          github_token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Install prek
        run: npm install -g @j178/prek

      - name: Run prek checks
        run: |
          if [ -n "${{ inputs.commit_sha }}" ]; then
            prek run --all-files
          else
            prek run --from-ref origin/${{ env.PR_BASE_REF }} --to-ref HEAD
          fi

  # Job 2: Unit tests across all platforms
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    if: >-
      !inputs.image_acceptance && github.event.label.name != 'run-image-acceptance' &&
      github.event_name != 'schedule' &&
      (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          commit_sha: ${{ inputs.commit_sha }}
          github_token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Disable Windows Defender (Windows only)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Host "::warning::Failed to disable real-time monitoring: $_" }
          try { Add-MpPreference -ExclusionPath "${{ github.workspace }}" } catch { Write-Host "::warning::Failed to add exclusion path: $_" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run extension system tests
        run: bunx vitest run

      - name: Run Electron preview network privacy test
        if: runner.os == 'macOS'
        run: bun run test:e2e tests/e2e/preview-privacy/preview-network-logs.e2e.ts --reporter=list --retries=0

  # Job 3: Coverage test (Linux only)
  coverage-tests:
    name: Coverage Test
    if: >-
      !inputs.image_acceptance && github.event.label.name != 'run-image-acceptance' &&
      github.event_name != 'schedule' &&
      (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          commit_sha: ${{ inputs.commit_sha }}
          github_token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run coverage tests
        id: coverage
        continue-on-error: true
        run: bun run test:coverage

      - name: Upload coverage to Codecov (Linux coverage only)
        if: always() && hashFiles('coverage/lcov.info') != '' && github.repository == 'iOfficeAI/AionUi'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
      - name: Skip Codecov upload when preconditions are not met
        if: always() && hashFiles('coverage/lcov.info') != '' && github.repository != 'iOfficeAI/AionUi'
        shell: bash
        run: |
          echo 'Skipping Codecov upload due to unmet preconditions.'
          echo "Repository: ${{ github.repository }}"
      - name: Coverage result summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.coverage.outcome }}" = "failure" ]; then
            echo "::warning::Coverage tests failed (non-blocking). Check logs for failed test details."
            echo "## Coverage check (non-blocking warning)" >> $GITHUB_STEP_SUMMARY
            echo "Coverage command failed in this run. Please review test failures in logs." >> $GITHUB_STEP_SUMMARY
            if [ -f coverage/lcov.info ]; then
              echo "lcov.info exists, Codecov upload can still run." >> $GITHUB_STEP_SUMMARY
            else
              echo "lcov.info not found, Codecov upload was skipped." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## Coverage check" >> $GITHUB_STEP_SUMMARY
            echo "Coverage command passed." >> $GITHUB_STEP_SUMMARY
            if [ -f coverage/lcov.info ]; then
              echo "Uploaded Linux (ubuntu-latest) coverage to Codecov." >> $GITHUB_STEP_SUMMARY
            else
              echo "Coverage passed but lcov.info is missing; Codecov upload was skipped." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload coverage artifacts
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  i18n-check:
    name: I18n Check
    if: >-
      !inputs.image_acceptance && github.event.label.name != 'run-image-acceptance' &&
      github.event_name != 'schedule' &&
      (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run i18n validation (warning-only)
        id: i18n
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-i18n.js 2>&1 | tee i18n-check.log

      - name: Publish i18n summary
        if: always()
        shell: bash
        run: |
          echo "## i18n validation" >> $GITHUB_STEP_SUMMARY
          if grep -q "⚠️" i18n-check.log; then
            echo "Missing/incomplete translations found. Please review warnings below." >> $GITHUB_STEP_SUMMARY
          else
            echo "No i18n warnings detected." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>i18n log</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat i18n-check.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

  # Job 4: Build test across representative PR platforms (parallel with code-quality and unit-tests)
  build-test:
    name: Build Test (${{ matrix.platform }})
    needs: full-verify-gate
    if: needs.full-verify-gate.outputs.run == 'true' && inputs.skip_build_test != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-arm64'
            os: 'macos-15'
            arch: 'arm64'
            target: '--mac'
            build_args: '--mac --arm64'
            unpacked_dir: 'mac-arm64'
          - platform: 'windows-x64'
            os: 'windows-2022'
            arch: 'x64'
            target: '--win'
            build_args: '--win --x64'
            unpacked_dir: 'win-unpacked'
          - platform: 'linux-x64'
            os: 'ubuntu-latest'
            arch: 'x64'
            target: '--linux'
            build_args: '--linux --x64'
            unpacked_dir: 'linux-unpacked'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || (github.event_name == 'schedule' && github.sha) || github.ref }}

      - name: Resolve PR or merged-source context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          commit_sha: ${{ inputs.commit_sha }}
          github_token: ${{ github.token }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: Get Electron version
        id: electron-version
        shell: bash
        run: |
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')")
          echo "version=$ELECTRON_VERSION" >> $GITHUB_OUTPUT
          echo "Electron version: $ELECTRON_VERSION"

      # Restore Electron/Electron-Builder caches before install-app-deps
      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: Cache status
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: Rebuild native modules for Electron (non-Windows)
        if: "!startsWith(matrix.platform, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Setup MSBuild (Windows only)
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Build test (Windows x64)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD TEST: ${{ matrix.platform }}"
          Write-Host "=========================================="
          node scripts/build-with-builder.js x64 --win --x64
          Write-Host "✓Build test passed for ${{ matrix.platform }}"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_runtime: electron
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          CI: true
          GH_TOKEN: ${{ github.token }}

      - name: Build test (non-Windows)
        if: "!startsWith(matrix.platform, 'windows')"
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD TEST: ${{ matrix.platform }}"
          echo "=========================================="
          node scripts/build-with-builder.js auto ${{ matrix.build_args }}
          echo "✓Build test passed for ${{ matrix.platform }}"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_runtime: electron
          npm_config_target: ${{ steps.electron-version.outputs.version }}
          npm_config_disturl: https://electronjs.org/headers
          CI: true
          GH_TOKEN: ${{ github.token }}

      - name: Verify build artifacts exist
        shell: bash
        run: |
          echo "=========================================="
          echo "VERIFY ARTIFACTS: ${{ matrix.platform }}"
          echo "=========================================="
          ls -lah out || true

          case "${{ matrix.platform }}" in
            windows-*)
              ls out/*.exe out/*latest*.yml >/dev/null
              ;;
            macos-*)
              ls out/*.dmg out/*.zip out/*latest*.yml >/dev/null
              ;;
            linux-x64)
              ls out/*.deb out/*latest*.yml >/dev/null
              ;;
          esac

      - name: Silent install smoke test (Windows x64)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "SMOKE INSTALL: windows-x64"
          Write-Host "=========================================="

          $installer = Get-ChildItem -Path out -Filter "aelix-studio-*-win-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer found in out/"
          }

          Write-Host "Using installer: $($installer.FullName)"
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru -NoNewWindow
          Write-Host "Installer exit code: $($installProcess.ExitCode)"
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent install failed with exit code $($installProcess.ExitCode)"
          }

          $candidates = @(
            "$env:LOCALAPPDATA\\Programs\\Aelix Studio\\Aelix Studio.exe",
            "$env:ProgramFiles\\Aelix Studio\\Aelix Studio.exe",
            "$env:ProgramFiles(x86)\\Aelix Studio\\Aelix Studio.exe"
          )

          $installedExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installedExe) {
            throw "Silent install finished but app executable not found in expected locations"
          }

          Write-Host "Installed executable: $installedExe"

      - name: Install smoke test (macOS arm64)
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "SMOKE INSTALL: macos-arm64"
          echo "=========================================="

          DMG_FILE=$(ls out/*.dmg | head -n 1)
          MOUNT_POINT="/tmp/aelix-studio-smoke-mount"
          APP_DIR="/tmp/aelix-studio-smoke-app"

          rm -rf "$MOUNT_POINT" "$APP_DIR"
          mkdir -p "$MOUNT_POINT" "$APP_DIR"

          hdiutil attach "$DMG_FILE" -nobrowse -mountpoint "$MOUNT_POINT"
          cp -R "$MOUNT_POINT"/*.app "$APP_DIR"/
          hdiutil detach "$MOUNT_POINT"

          APP_PATH=$(ls -d "$APP_DIR"/*.app | head -n 1)
          APP_BIN="$APP_PATH/Contents/MacOS/Aelix Studio"

          test -x "$APP_BIN"
          "$APP_BIN" --version || true

      - name: Install smoke test (Linux)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "SMOKE INSTALL: linux-x64"
          echo "=========================================="

          DEB_FILE=$(ls out/*.deb | head -n 1)
          PKG_NAME=$(dpkg-deb -f "$DEB_FILE" Package)
          sudo dpkg -i "$DEB_FILE" || sudo apt-get install -f -y

          INSTALLED_BIN=$(dpkg -L "$PKG_NAME" | grep -E '/opt/.*/aelix-studio$' | head -n 1 || true)
          if [ -z "$INSTALLED_BIN" ]; then
            echo "Package files:"
            dpkg -L "$PKG_NAME" | head -n 50
            echo "No installed executable path matched expected pattern"
            exit 1
          fi

          test -x "$INSTALLED_BIN"
          sudo dpkg --remove "$PKG_NAME"
          test ! -e "$INSTALLED_BIN"

  webui-install:
    name: Standalone Studio WebUI
    needs: full-verify-gate
    if: needs.full-verify-gate.outputs.run == 'true' && contains(github.event.pull_request.labels.*.name, 'full-verify')
    permissions:
      contents: read
    uses: ./.github/workflows/pack-web-cli.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      skip_code_quality: true

  # Job 5: Test release scripts (fast, no build required)
  release-script-test:
    name: Release Script Test
    if: >-
      !inputs.image_acceptance && github.event.label.name != 'run-image-acceptance' &&
      github.event_name != 'schedule' && github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Create mock build artifacts
        shell: bash
        run: bash scripts/create-mock-release-artifacts.sh build-artifacts

      - name: Run prepare-release-assets script
        shell: bash
        env:
          MOCK_VERSION: '1.0.0'
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Validate script output
        shell: bash
        run: bash scripts/verify-release-assets.sh release-assets

  # A scheduled run that does not pass is recorded in one tracking Issue (never one per failure).
  # This is the only job with issues: write, and it never runs for pull requests.
  # Tracked: a needed job that failed, or one that ended cancelled while the run itself was not
  # cancelled. GitHub documents that it cancels a job which exceeds `timeout-minutes`, so a timeout
  # should land here; no job in this repository has timed out yet to confirm how it is reported.
  # Not tracked: a run cancelled as a whole, by a person or by a newer run. That is a deliberate
  # act, and `!cancelled()` then keeps this job out even if a job had already failed.
  scheduled-failure:
    name: Track scheduled failure
    if: ${{ !cancelled() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [full-verify-gate, io-uring-trace-probe, provider-preview, build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: full-verify-scheduled-failure
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/track-scheduled-failure
        with:
          github_token: ${{ github.token }}
          results: ${{ toJSON(needs) }}
