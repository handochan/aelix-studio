name: Aelix Studio checks
on:
  push:
    branches: [main, chore/aelix-studio-bootstrap]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run lint -- --quiet
      - run: bun run format:check
      - run: bun x tsc --noEmit
      - run: bun run i18n:types && node scripts/check-i18n.js
      - run: bun run test
      - run: bun run package
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - run: python scripts/aelix-studio/prepareRuntime.py
      - run: python -m unittest discover -s tests/studio -p "test_*.py"
      - name: Relocate the complete runtime and open a real ACP session
        run: python scripts/aelix-studio/smokeRuntime.py --relocate
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-receipt-${{ matrix.target }}
          path: resources/bundled-aelix/*/manifest.json
  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            runtime: out/mac-arm64/Aelix Studio.app/Contents/Resources/bundled-aelix/darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
            runtime: out/mac/Aelix Studio.app/Contents/Resources/bundled-aelix/darwin-x64
          - os: ubuntu-22.04
            target: linux-x64
            runtime: out/linux-unpacked/resources/bundled-aelix/linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            runtime: out/linux-arm64-unpacked/resources/bundled-aelix/linux-arm64
          - os: windows-2022
            target: win32-x64
            runtime: out/win-unpacked/resources/bundled-aelix/win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: bun x playwright install-deps chromium
      - run: bun run studio:dist
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Verify real host registration, team startup and offline Analytics
        env:
          STUDIO_REQUIRE_HOST_TEST: '1'
        run: python -m unittest discover -s tests/studio -p "test_*.py"
      - name: Verify both packaged agent profiles after relocation
        env:
          STUDIO_PACKAGED_RUNTIME: ${{ matrix.runtime }}
        run: python scripts/aelix-studio/smokeRuntime.py --relocate
      - name: Open the packaged desktop and check the renderer
        if: runner.os != 'Linux'
        env:
          E2E_PACKAGED: '1'
        run: bun x playwright test tests/e2e/specs/app-launch.e2e.ts
      - name: Open the packaged Linux desktop under Xvfb
        if: runner.os == 'Linux'
        env:
          E2E_PACKAGED: '1'
        run: xvfb-run -a bun x playwright test tests/e2e/specs/app-launch.e2e.ts
      - uses: actions/upload-artifact@v4
        with:
          name: aelix-studio-${{ matrix.target }}
          path: |
            out/*.exe
            out/*.dmg
            out/*.zip
            out/*.deb
            out/latest*.yml
  offline-webui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aelix-studio:test .
      - name: Start with no external network and verify API authentication
        run: |
          docker volume create studio-test-data
          docker run --detach --network none --name studio-offline -v studio-test-data:/data -v "$PWD/tests:/app/tests:ro" -e STUDIO_PERSISTENCE_TEST=1 aelix-studio:test
          docker exec studio-offline bun -e '
            let ready = false;
            for (let i = 0; i < 90; i++) {
              try { if ((await fetch("http://127.0.0.1:3000/")).ok) { ready = true; break; } } catch {}
              await Bun.sleep(1000);
            }
            if (!ready) throw new Error("WebUI did not become ready");
            const login = await fetch("http://127.0.0.1:3000/login");
            const denied = await fetch("http://127.0.0.1:3000/api/agents/management", { headers: { "x-aionui-internal": "1" } });
            if (login.status !== 200 || denied.status !== 401) throw new Error("WebUI authentication boundary failed");
          '
      - name: Open a real bundled ACP session without external networking
        run: docker run --rm --network none --entrypoint /app/resources/bundled-aelix/linux-x64/python/bin/python3 aelix-studio:test /app/scripts/aelix-studio/smokeRuntime.py --relocate
      - name: Verify isolated offline analysis and real backend registration
        run: docker run --rm --network none -v "$PWD/tests:/app/tests:ro" -e STUDIO_REQUIRE_HOST_TEST=1 --entrypoint /app/resources/bundled-aelix/linux-x64/python/bin/python3 aelix-studio:test -I -B -m unittest discover -s tests/studio -p 'test_*.py'
      - name: Preserve settings and restore an actual session after container replacement
        run: |
          docker exec studio-offline /app/resources/bundled-aelix/linux-x64/python/bin/python3 -I /app/tests/studio/persistence.py record
          docker rm --force studio-offline
          docker run --detach --network none --name studio-offline -v studio-test-data:/data -v "$PWD/tests:/app/tests:ro" -e STUDIO_PERSISTENCE_TEST=1 aelix-studio:test
          docker exec studio-offline bun -e '
            for (let i = 0; i < 90; i++) {
              try { if ((await fetch("http://127.0.0.1:3000/login")).ok) process.exit(0); } catch {}
              await Bun.sleep(1000);
            }
            throw new Error("Recreated WebUI did not become ready");
          '
          docker exec studio-offline /app/resources/bundled-aelix/linux-x64/python/bin/python3 -I /app/tests/studio/persistence.py restore
      - if: always()
        run: |
          docker rm --force studio-offline || true
          docker volume rm studio-test-data || true
