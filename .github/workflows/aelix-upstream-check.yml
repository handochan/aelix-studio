name: Aelix Studio upstream check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/aelix-studio/upstream.json'
      - 'scripts/aelix-studio/checkUpstream.mjs'
      - '.github/workflows/aelix-upstream-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare the pinned upstream with the latest stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/aelix-studio/checkUpstream.mjs
