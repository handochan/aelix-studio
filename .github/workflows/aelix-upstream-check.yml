name: Aelix Studio upstream check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/aelix-studio/upstream.json'
      - 'scripts/aelix-studio/checkUpstream.mjs'
      - 'tests/unit/studio/upstreamTracking.test.ts'
      - 'tests/unit/studio/fixtures/**'
      - '.github/workflows/aelix-upstream-check.yml'
  pull_request:
    paths:
      - 'docs/aelix-studio/upstream.json'
      - 'scripts/aelix-studio/checkUpstream.mjs'
      - 'tests/unit/studio/upstreamTracking.test.ts'
      - 'tests/unit/studio/fixtures/**'
      - '.github/workflows/aelix-upstream-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare the pinned upstream with the latest stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/aelix-studio/checkUpstream.mjs --fail-on-drift > upstream-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aionui-upstream-report
          path: upstream-report.json
          if-no-files-found: error
