name: Studio resources native

# Runs the D16 global resources helper suite against the exact pinned native source on POSIX
# and Windows. Without STUDIO_RESOURCES_NATIVE_SOURCE the pinned cases skip, so this job is the
# one place they run in CI.
on:
  pull_request:
    paths:
      - 'packages/web-host/src/studio-auth/resources/**'
      - 'packages/web-host/src/studio-auth/runtime.ts'
      - 'scripts/studio-preview/baseline.json'
      - 'scripts/studio-preview/packaging/launch.py'
      - 'bun.lock'
      - '.github/workflows/studio-resources-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-resources-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  pinned-native:
    name: Pinned native resources helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check out the pinned native source
        id: native
        run: |
          baseline=scripts/studio-preview/baseline.json
          repository=$(node -p "require('./$baseline').native.sourceTag.repository")
          commit=$(node -p "require('./$baseline').native.sourceTag.commit")
          [[ "$repository" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Unexpected native repository: $repository"; exit 1; }
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected native commit: $commit"; exit 1; }
          source="$RUNNER_TEMP/aelix-ai"
          git init --quiet "$source"
          # Keep the source bytes the pinned archive has.
          git -C "$source" config core.autocrlf false
          git -C "$source" fetch --quiet --depth 1 -- "$repository" "$commit"
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$commit"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Create the native venv
        working-directory: ${{ steps.native.outputs.source }}
        run: uv sync --frozen --python 3.12
      - name: Warm the native imports
        # A first import from a fresh venv (and its first malware scan on Windows) can outlast the
        # helper's 40 s deadline. The suite itself runs with -B, so warm the same modules once here.
        working-directory: ${{ steps.native.outputs.source }}
        run: >-
          uv run --frozen --no-sync python -I -B -c
          "import aelix_ai.settings.settings_manager, aelix_coding_agent.agents.discovery,
          aelix_coding_agent.core.mcp_config_edit, aelix_coding_agent.core.mcp_selection,
          aelix_coding_agent.core.skill_selection, aelix_coding_agent.tools"
      - name: TEMPORARY diagnose Windows directory ACLs
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: ${{ steps.native.outputs.source }}
        run: |
          uv run --frozen --no-sync python -I -B - "$RUNNER_TEMP" <<'PY'
          import os, pathlib, subprocess, sys, tempfile
          import win32api, win32con, win32security as sec
          base = pathlib.Path(tempfile.mkdtemp(dir=sys.argv[1]))
          made = base / "mode700"
          os.mkdir(made, 0o700)
          plain = base / "plain"
          os.mkdir(plain)
          token = sec.OpenProcessToken(win32api.GetCurrentProcess(), win32con.TOKEN_QUERY)
          print("token user", sec.ConvertSidToStringSid(sec.GetTokenInformation(token, sec.TokenUser)[0]))
          print("token owner", sec.ConvertSidToStringSid(sec.GetTokenInformation(token, sec.TokenOwner)))
          for directory in (pathlib.Path(os.environ["USERPROFILE"]), pathlib.Path(sys.argv[1]), base, made, plain):
              print("==", directory)
              print(subprocess.run(["icacls", str(directory)], capture_output=True, text=True).stdout)
              sd = sec.GetNamedSecurityInfo(str(directory), sec.SE_FILE_OBJECT,
                  sec.OWNER_SECURITY_INFORMATION | sec.DACL_SECURITY_INFORMATION)
              print("owner", sec.ConvertSidToStringSid(sd.GetSecurityDescriptorOwner()))
              acl = sd.GetSecurityDescriptorDacl()
              for index in range(acl.GetAceCount()):
                  ace = acl.GetAce(index)
                  print("ace", ace[0], hex(ace[1]), sec.ConvertSidToStringSid(ace[-1]))
          PY
      - name: Run the pinned native resources suite
        env:
          STUDIO_RESOURCES_NATIVE_SOURCE: ${{ steps.native.outputs.source }}
        run: bunx vitest run packages/web-host/src/studio-auth/resources/service.test.ts
