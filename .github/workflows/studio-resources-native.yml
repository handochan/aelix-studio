name: Studio resources native

# Runs the D16 global resources helper suite against the exact pinned native source on POSIX
# and Windows. Without STUDIO_RESOURCES_NATIVE_SOURCE the pinned cases skip, so this job is the
# one place they run in CI.
on:
  pull_request:
    paths:
      - 'packages/web-host/src/studio-auth/resources/**'
      - '.github/workflows/studio-resources-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-resources-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  pinned-native:
    name: Pinned native resources helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check out the pinned native source
        id: native
        run: |
          baseline=scripts/studio-preview/baseline.json
          repository=$(node -p "require('./$baseline').native.sourceTag.repository")
          commit=$(node -p "require('./$baseline').native.sourceTag.commit")
          source="$RUNNER_TEMP/aelix-ai"
          git init --quiet "$source"
          # Keep the source bytes the pinned archive has.
          git -C "$source" config core.autocrlf false
          git -C "$source" fetch --quiet --depth 1 "$repository" "$commit"
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$commit"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Create the native venv
        working-directory: ${{ steps.native.outputs.source }}
        run: uv sync --frozen --python 3.12
      - name: Warm the native imports
        # A first import from a fresh venv (and its first malware scan on Windows) can outlast the
        # helper's 40 s deadline. The suite itself runs with -B, so warm the same modules once here.
        working-directory: ${{ steps.native.outputs.source }}
        run: >-
          uv run --frozen --no-sync python -I -B -c
          "import aelix_ai.settings.settings_manager, aelix_coding_agent.agents.discovery,
          aelix_coding_agent.core.mcp_config_edit, aelix_coding_agent.core.mcp_selection,
          aelix_coding_agent.core.skill_selection, aelix_coding_agent.tools"
      - name: Run the pinned native resources suite
        env:
          STUDIO_RESOURCES_NATIVE_SOURCE: ${{ steps.native.outputs.source }}
        run: bunx vitest run packages/web-host/src/studio-auth/resources/service.test.ts
